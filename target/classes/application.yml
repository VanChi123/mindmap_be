server:
  port: 8080

spring:
  datasource:
    # Sửa 3 dòng dưới theo Oracle của bạn, hoặc đặt biến môi trường cùng tên.
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USER:mindmap}
    password: ${DB_PASSWORD:mindmap}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway tạo bảng (db/migration). Hibernate không tự sửa schema.
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true # cấu hình để giữ nguyên db hiện tại
    baseline-version: 0 # để chạy version 1
